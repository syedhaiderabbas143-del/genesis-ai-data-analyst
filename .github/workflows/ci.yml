name: Genesis AI CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pytest
      - name: Compile Python
        run: python -m compileall -q .
      - name: Run tests
        env:
          GENESIS_JWT_SECRET: ci-only-secret-that-is-long-enough-123456789
        run: pytest -q
